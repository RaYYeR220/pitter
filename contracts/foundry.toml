[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
solc = "0.8.30"
evm_version = "cancun"
network = "monad"
optimizer = true
optimizer_runs = 200
via_ir = true
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 128
fail_on_revert = true

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120

[lint]
# Minute-granular windows compare against block.timestamp by design; a report and a batch settlement are atomic,
# so their loops revert and call out on purpose; the events flagged as following an external call follow only
# static calls or calls made under a reentrancy guard.
exclude_lints = ["block-timestamp", "require-revert-in-loop", "calls-loop", "reentrancy-events"]
